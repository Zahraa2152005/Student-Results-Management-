<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1 class="main-title">نظام إدارة النتائج</h1>
            <p class="subtitle">
                إدارة درجات الطلاب وتحليل النتائج الدراسية
            </p>
        </div>

        <div class="card custom-card mb-4">
            <div class="card-body p-4">

                <h3 class="section-title mb-4">إضافة طالب جديد</h3>

                <form id="studentForm">

                    <div class="mb-3">
                        <label for="studentName" class="form-label">
                            اسم الطالب
                        </label>

                        <input type="text"
                               id="studentName"
                               class="form-control"
                               placeholder="أدخل اسم الطالب">
                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label for="grade1" class="form-label">
                                درجة المادة الأولى
                            </label>

                            <input type="number"
                                   id="grade1"
                                   class="form-control"
                                   placeholder="من 0 إلى 100">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="grade2" class="form-label">
                                درجة المادة الثانية
                            </label>

                            <input type="number"
                                   id="grade2"
                                   class="form-control"
                                   placeholder="من 0 إلى 100">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="grade3" class="form-label">
                                درجة المادة الثالثة
                            </label>

                            <input type="number"
                                   id="grade3"
                                   class="form-control"
                                   placeholder="من 0 إلى 100">
                        </div>

                    </div>

                    <div class="mb-4">
                        <label for="attendance" class="form-label">
                            نسبة الحضور
                        </label>

                        <input type="number"
                               id="attendance"
                               class="form-control"
                               placeholder="أدخل نسبة الحضور من 0 إلى 100">
                    </div>

                    <div id="errorBox" class="alert alert-danger d-none">
                    </div>

                    <button type="button"
                            id="addStudentBtn"
                            class="btn btn-purple w-100">
                        إضافة طالب
                    </button>

                </form>

            </div>
        </div>

        <div class="card custom-card mb-4">
            <div class="card-body p-4">

                <h3 class="section-title mb-3">قائمة الطلاب</h3>

                <div id="studentsList">
                    <p class="empty-message">
                        لم يتم إضافة أي طلاب حتى الآن.
                    </p>
                </div>

            </div>
        </div>

        <div class="card custom-card mb-4">
            <div class="card-body p-4">

                <h3 class="section-title mb-3">لجنة الرأفة</h3>

                <p class="subtitle mb-3">
                    استخراج الطلاب المتعثرين وإضافة درجات الرأفة إلى متوسطاتهم.
                </p>

                <button type="button"
                        id="mercyBtn"
                        class="btn btn-purple w-100 mb-4">
                    تفعيل لجنة الرأفة
                </button>

                <div id="mercyReport">
                    <p class="empty-message">
                        التقرير النهائي سيظهر هنا.
                    </p>
                </div>

            </div>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
